rules:
  # ============================================================================
  # LLM02: SQL Injection - MCP Tool Parameters (Python MCP SDK / FastMCP)
  # ============================================================================
  # MCP tools that concatenate tool parameters into SQL allow SQL injection.
  #
  # OWASP: LLM02, LLM07 (Insecure Plugin Design)
  # CWE: CWE-89
  # ============================================================================

  - id: mcp-llm02-tool-param-to-sql
    mode: taint
    pattern-sources:
      - pattern: $ARG
        pattern-inside: |
          @$MCP.tool()
          def $FN($ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.tool()
          def $FN($ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.tool()
          def $FN(..., $ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.tool()
          def $FN(..., $ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.async_tool()
          def $FN($ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.async_tool()
          def $FN($ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.async_tool()
          def $FN(..., $ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.async_tool()
          def $FN(..., $ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.resource(...)
          def $FN($ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.resource(...)
          def $FN($ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.resource(...)
          def $FN(..., $ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.resource(...)
          def $FN(..., $ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.prompt()
          def $FN($ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.prompt()
          def $FN($ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.prompt()
          def $FN(..., $ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.prompt()
          def $FN(..., $ARG, ...):
            ...
    pattern-sinks:
      - pattern: $CURSOR.execute($ARG, ...)
      - pattern: $CURSOR.executemany($ARG, ...)
      - pattern: $CONN.execute($ARG, ...)
      - pattern: $DB.execute($ARG, ...)
      - pattern: $CURSOR.execute(f"...", ...)
      - pattern: $CURSOR.execute("..." + $ARG + "...", ...)
    message: "LLM02: SQL Injection - MCP tool parameter used in SQL execute (use parameterized queries)"
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      subcategory: sql-injection
      owasp: "LLM02"
      owasp-title: "Insecure Output Handling (SQL Injection)"
      owasp-url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/LLM_Top_10/LLM02.html"
      cwe: ["CWE-89"]
      cwe-url: ["https://cwe.mitre.org/data/definitions/89.html"]
      tags: ["owasp", "llm02", "sql-injection", "mcp", "fastmcp", "tool", "ai-enhanced"]
      technology: ["python", "mcp", "llm"]
      confidence: "high"
      impact: "critical"
      likelihood: "high"
      description: "An MCP tool passes one of its parameters into a raw SQL execute() call. Tool arguments are client/LLM-controlled and can contain SQL injection payloads."
      remediation: "Use parameterized queries (e.g. cursor.execute('SELECT * FROM t WHERE id = ?', (arg,))) and never concatenate tool parameters into SQL strings."
      examples:
        vulnerable: "samples/mcp/mcp_sql_injection.py"
      references:
        - "https://modelcontextprotocol.io"
    paths:
      include:
        - "**/*.py"
