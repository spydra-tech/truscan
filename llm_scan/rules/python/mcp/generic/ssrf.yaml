rules:
  # ============================================================================
  # LLM02/LLM07: SSRF - MCP Tool Parameters (Python MCP SDK / FastMCP)
  # ============================================================================
  # MCP tools that take URLs from the client/LLM and pass them to requests
  # or urllib without validation allow SSRF.
  #
  # OWASP: LLM02, LLM07 (Insecure Plugin Design)
  # CWE: CWE-918
  # ============================================================================

  - id: mcp-llm02-tool-param-to-request
    mode: taint
    pattern-sources:
      - pattern: $ARG
        pattern-inside: |
          @$MCP.tool()
          def $FN($ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.tool()
          def $FN($ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.tool()
          def $FN(..., $ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.tool()
          def $FN(..., $ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.async_tool()
          def $FN($ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.async_tool()
          def $FN($ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.async_tool()
          def $FN(..., $ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.async_tool()
          def $FN(..., $ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.resource(...)
          def $FN($ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.resource(...)
          def $FN($ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.resource(...)
          def $FN(..., $ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.resource(...)
          def $FN(..., $ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.prompt()
          def $FN($ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.prompt()
          def $FN($ARG, ...):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.prompt()
          def $FN(..., $ARG):
            ...
      - pattern: $ARG
        pattern-inside: |
          @$MCP.prompt()
          def $FN(..., $ARG, ...):
            ...
    pattern-sinks:
      - pattern: requests.get($ARG, ...)
      - pattern: requests.post($ARG, ...)
      - pattern: requests.request(..., $ARG, ...)
      - pattern: urllib.request.urlopen($ARG, ...)
      - pattern: urllib.request.Request($ARG, ...)
      - pattern: httpx.get($ARG, ...)
      - pattern: httpx.post($ARG, ...)
      - pattern: aiohttp.request(..., url=$ARG, ...)
    message: "LLM02/LLM07: SSRF - MCP tool parameter (URL) passed to HTTP client without validation"
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      subcategory: ssrf
      owasp: "LLM02"
      owasp-title: "Insecure Output Handling (SSRF)"
      owasp-url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/LLM_Top_10/LLM02.html"
      cwe: ["CWE-918"]
      cwe-url: ["https://cwe.mitre.org/data/definitions/918.html"]
      tags: ["owasp", "llm02", "llm07", "ssrf", "mcp", "fastmcp", "tool", "ai-enhanced"]
      technology: ["python", "mcp", "llm"]
      confidence: "medium"
      impact: "high"
      likelihood: "medium"
      description: "An MCP tool uses one of its parameters as a URL in requests.get/post or urllib. Tool arguments are client/LLM-controlled and can target internal services (SSRF)."
      remediation: "Validate and allowlist URLs (scheme and host). Block private IP ranges and internal hostnames. Use a dedicated HTTP client with SSRF protections."
      examples:
        vulnerable: "samples/mcp/mcp_ssrf.py"
      references:
        - "https://modelcontextprotocol.io"
    paths:
      include:
        - "**/*.py"
